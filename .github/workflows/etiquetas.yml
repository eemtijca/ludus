# Etiqueta pull requests pelos caminhos e pelo título. A validação de título e
# etiquetas fica no workflow validar.yml, em pull_request.
name: Etiquetas

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  classificar:
    name: classificar
    runs-on: ubuntu-latest
    steps:
      - name: Aplicar etiquetas de área pelos caminhos
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
      - name: Aplicar etiqueta de tipo pelo título
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const mapa = {
              feat: 'enhancement',
              fix: 'bug',
              docs: 'documentation',
              refactor: 'refactor',
              test: 'testes',
              perf: 'desempenho',
              ci: 'ci',
              build: 'manutencao',
              chore: 'manutencao',
              deps: 'dependencies',
            };
            const titulo = context.payload.pull_request.title;
            const correspondencia = titulo.match(/^([a-z]+)(?:\([^)]+\))?(!)?:/);
            const tipo = correspondencia?.[1];
            const quebra = Boolean(correspondencia?.[2]);
            const etiquetas = [];
            const etiquetaTipo = tipo ? mapa[tipo] : undefined;
            if (etiquetaTipo) {
              etiquetas.push(etiquetaTipo);
            }
            if (quebra) {
              etiquetas.push('versao: maior');
            } else if (tipo === 'feat') {
              etiquetas.push('versao: menor');
            } else if (['fix', 'perf', 'refactor', 'revert', 'deps'].includes(tipo)) {
              etiquetas.push('versao: correcao');
            }
            if (etiquetas.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: etiquetas,
              });
            }

