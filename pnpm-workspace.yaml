# Configuração do pnpm. O projeto não tem workspaces; o arquivo existe porque,
# a partir do pnpm 11, as configurações ficam em pnpm-workspace.yaml.
# allowBuilds autoriza apenas os scripts de instalação necessários ao build.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  es5-ext: true
  sharp: true
  unrs-resolver: true
