# Configuração do pnpm. O projeto não tem workspaces; o arquivo existe porque,
# a partir do pnpm 11, as configurações ficam em pnpm-workspace.yaml.
# allowBuilds autoriza apenas os scripts de instalação necessários ao build.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  es5-ext: true
  sharp: true
  unrs-resolver: true

# Overrides de segurança para dependências transitivas cujos pais ainda não
# declaram uma versão corrigida. Remover quando o pai passar a resolver a
# versão corrigida por conta própria.
overrides:
  'brace-expansion@>=1.0.0 <1.1.21': '1.1.21'
  'brace-expansion@>=4.0.0 <5.0.12': '5.0.12'
  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'
  'source-map-js@<1.2.2': '1.2.2'
  'glob@>=9.0.0 <=14.0.1': '14.0.4'
  'minimatch@>=7.0.0 <11.0.1': '11.0.5'
  'prismjs@<1.30.0': '1.30.0'
